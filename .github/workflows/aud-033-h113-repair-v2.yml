name: AUD-033 H113 Repair Executor v2

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/aud-033-h113-repair-v2.yml
      - tools/audit/aud033_h113_repair.py
      - tools/audit/aud033_external_certificate_header_fix.py

permissions:
  contents: write

jobs:
  repair:
    name: Apply validate and preserve AUD-033 evidence
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned dependency
        run: python -m pip install python-docx==1.2.0

      - name: Apply idempotent AUD-033 correction
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/audit/aud033_h113_repair.py \
            > .aud033-repair.stdout.log \
            2> .aud033-repair.stderr.log
          python -B tools/audit/aud033_external_certificate_header_fix.py \
            > .aud033-cert-header-repair.stdout.log \
            2> .aud033-cert-header-repair.stderr.log
          mkdir -p .aud033-evidence
          mv .aud033-repair.stdout.log .aud033-evidence/repair.stdout.log
          mv .aud033-repair.stderr.log .aud033-evidence/repair.stderr.log
          mv .aud033-cert-header-repair.stdout.log .aud033-evidence/cert-header-repair.stdout.log
          mv .aud033-cert-header-repair.stderr.log .aud033-evidence/cert-header-repair.stderr.log

      - name: Instrument full H113 test payload capture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/intake/test_h113_current_tree_identity_generate.py')
          text=path.read_text(encoding='utf-8')
          old='''            self.assertEqual(completed.returncode, 0, completed.stdout + completed.stderr)\n            result = json.loads(result_path.read_text(encoding="utf-8"))\n'''
          new='''            result = json.loads(result_path.read_text(encoding="utf-8"))\n            evidence_dir = REPO_ROOT / ".aud033-evidence" / "h113-generate"\n            evidence_dir.mkdir(parents=True, exist_ok=True)\n            (evidence_dir / "generate.full.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")\n            (evidence_dir / "generate.stdout.log").write_text(completed.stdout, encoding="utf-8")\n            (evidence_dir / "generate.stderr.log").write_text(completed.stderr, encoding="utf-8")\n            (evidence_dir / "generate.rc").write_text(str(completed.returncode) + "\\n", encoding="utf-8")\n            self.assertEqual(completed.returncode, 0, json.dumps(result, ensure_ascii=False, indent=2))\n'''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('AUD033_TEST_INSTRUMENTATION_BLOCKED')
              path.write_text(text.replace(old,new), encoding='utf-8', newline='\n')
          PY

      - name: Run all validation checks without fail-fast loss
        id: validation
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p .aud033-evidence/checks
          failures=0

          run_check() {
            local name="$1"
            shift
            "$@" >".aud033-evidence/checks/${name}.stdout.log" 2>".aud033-evidence/checks/${name}.stderr.log"
            local rc=$?
            printf '%s\n' "$rc" >".aud033-evidence/checks/${name}.rc"
            if [[ "$rc" -ne 0 ]]; then
              failures=$((failures + 1))
              echo "AUD033_CHECK_FAIL:${name}:rc=${rc}"
              tail -n 100 ".aud033-evidence/checks/${name}.stdout.log" || true
              tail -n 100 ".aud033-evidence/checks/${name}.stderr.log" || true
            else
              echo "AUD033_CHECK_PASS:${name}"
            fi
          }

          run_check h113_generate_test python -B -m unittest tests.intake.test_h113_current_tree_identity_generate -v
          run_check windows_watchdog_test python -B -m unittest tests.intake.test_generate_windows_watchdog -v
          run_check external_artifact_refresh_test python -B -m unittest tests.intake.test_external_artifact_refresh -v
          run_check post_audit_truthfulness_test python -B -m unittest tests.intake.test_post_audit_truthfulness -v
          run_check governance_state_test python -B -m unittest tests.intake.test_governance_state -v
          run_check baseline_scanner python -B tools/audit/baseline_scanner.py --repo-root .
          run_check governance_state_check python -B tools/audit/governance_state_check.py --repo-root .
          run_check intake_audit python -B tools/audit/intake_audit.py --repo-root .
          run_check security_lite_scan python -B tools/audit/security_lite_scan.py --repo-root .
          run_check runtime_validator python -B engine/IDUNEX/99_MANIFESTS_SHA_LINEAGE/VALIDATE_IDUNEX_RUNTIME.py engine/IDUNEX
          run_check diff_check git diff --check

          git status --porcelain > .aud033-evidence/git-status-before-commit.txt
          printf '%s\n' "$failures" > .aud033-evidence/validation-failure-count.txt
          if [[ "$failures" -ne 0 ]]; then
            exit 1
          fi
          exit 0

      - name: Upload complete AUD-033 repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aud-033-h113-repair-${{ github.run_id }}
          path: .aud033-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Commit validated correction
        if: steps.validation.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aleducase"
          git config user.email "232152987+aleducase@users.noreply.github.com"
          rm -rf .aud033-evidence
          git add engine/IDUNEX governance/CURRENT_STATE.json governance/baseline REPOSITORY_MANIFEST.yml tests/intake/test_h113_current_tree_identity_generate.py docs/audits/GOV-IDUNEX-CorreccionResolucionIdentidadH113-20260722-v1-EN_REVISION.md
          git diff --cached --check
          git commit -m "fix(aud-033): resolve current-tree identity and external certificate parity"
          git push origin HEAD:${{ github.head_ref }}
          git rev-parse HEAD
