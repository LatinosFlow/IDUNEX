name: AUD-033 H113 Repair Executor

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/aud-033-h113-repair.yml

permissions:
  contents: write

jobs:
  repair:
    name: Apply and validate H113 current-tree identity fix
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned dependency
        run: python -m pip install python-docx==1.2.0

      - name: Apply exact AUD-033 source correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          root = Path('.').resolve()
          factory_path = root / 'engine/IDUNEX/03_PROJECT_FACTORY/02_PROTOCOLS/IDUNEX_PROJECT_FACTORY_v1.0.0.py'
          runner_path = root / 'engine/IDUNEX/03_PROJECT_FACTORY/02_PROTOCOLS/IDUNEX_PROJECT_MATRIX_31_RUNNER.py'
          changelog_path = root / 'engine/IDUNEX/00_INDEX/CHANGELOG.md'
          test_path = root / 'tests/intake/test_h113_current_tree_identity_generate.py'
          audit_path = root / 'docs/audits/GOV-IDUNEX-CorreccionResolucionIdentidadH113-20260722-v1-EN_REVISION.md'

          def replace_exact(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'AUD033_EXACT_REPLACEMENT_BLOCKED:{path}:{count}')
              path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          replace_exact(
              factory_path,
              '''            and state.get("motor_status")=="EN_REVISION"\n            and state.get("m02_result")=="M02_PASS"\n            and state.get("release_authorized") is False\n''',
              '''            and state.get("motor_status")=="EN_REVISION"\n            and isinstance(state.get("engine_change_control"), dict)\n            and state["engine_change_control"].get("current_engine_tree_sha256")==token\n            and state["engine_change_control"].get("current_engine_file_count")==manifest.get("file_count")\n            and state["engine_change_control"].get("current_engine_byte_count")==manifest.get("byte_count")\n            and state.get("release_authorized") is False\n''',
          )

          replace_exact(
              runner_path,
              '''    row["generate_result"] = gen.get("result")\n    row["generated_zip"] = gen.get("project_zip")\n    row["generated_companion"] = gen.get("companion")\n''',
              '''    row["generate_result"] = gen.get("result")\n    row["generate_fail_codes"] = list(gen.get("fail_codes") or [])\n    row["generate_root_cause_fail_codes"] = list(gen.get("root_cause_fail_codes") or [])\n    row["generate_root_cause_phase"] = gen.get("root_cause_phase")\n    row["generate_root_cause_detail"] = gen.get("root_cause_detail")\n    row["generate_stdout_tail"] = (gen_stdout or "")[-4000:]\n    row["generate_stderr_tail"] = (gen_stderr or "")[-4000:]\n    if row["generate_result"] != "PASS" and row["generate_fail_codes"]:\n        row["fail_codes"].extend(code for code in row["generate_fail_codes"] if code not in row["fail_codes"])\n    row["generated_zip"] = gen.get("project_zip")\n    row["generated_companion"] = gen.get("companion")\n''',
          )

          changelog = changelog_path.read_text(encoding='utf-8')
          marker = '- 2026-07-22 — AUD-033: H113 repository current-tree identity resolution decoupled from M02 approval; identity remains non-release and governance interlocks remain authoritative.\n'
          if marker not in changelog:
              changelog_path.write_text(changelog.rstrip() + '\n' + marker, encoding='utf-8', newline='\n')

          test_path.write_text('''from __future__ import annotations\n\nimport hashlib\nimport json\nimport subprocess\nimport sys\nimport tempfile\nimport unittest\nimport zipfile\nfrom pathlib import Path\n\nREPO_ROOT = Path(__file__).resolve().parents[2]\nFACTORY = REPO_ROOT / "engine/IDUNEX/03_PROJECT_FACTORY/02_PROTOCOLS/IDUNEX_PROJECT_FACTORY_v1.0.0.py"\nBASELINE = REPO_ROOT / "governance/baseline/IDUNEX_CURRENT_TREE_MANIFEST.json"\nSTATE = REPO_ROOT / "governance/CURRENT_STATE.json"\nSENTINEL = "ENGINE_ZIP_SHA256_EXTERNAL_COMPANION_REQUIRED"\n\n\nclass H113CurrentTreeIdentityGenerateTest(unittest.TestCase):\n    def test_non_release_current_tree_identity_generates_n1_without_circular_m02_dependency(self):\n        baseline = json.loads(BASELINE.read_text(encoding="utf-8"))\n        state = json.loads(STATE.read_text(encoding="utf-8"))\n        self.assertEqual(state["motor_status"], "EN_REVISION")\n        self.assertEqual(state["m02_result"], "NOT_RECOMPUTED_POST_AUD030")\n        self.assertFalse(state["release_authorized"])\n        self.assertFalse(state["tag_authorized"])\n        self.assertEqual(\n            state["engine_change_control"]["current_engine_tree_sha256"],\n            baseline["tree_sha256"],\n        )\n\n        with tempfile.TemporaryDirectory() as temp_dir:\n            root = Path(temp_dir)\n            input_path = root / "input.json"\n            output_dir = root / "output"\n            result_path = root / "generate.json"\n            input_path.write_text(\n                json.dumps({\n                    "project_id": "IDUNEX_PROJECT_AUD033_H113_N1_v1.0.0",\n                    "models": [{}],\n                }),\n                encoding="utf-8",\n            )\n            completed = subprocess.run(\n                [\n                    sys.executable, "-B", str(FACTORY), "generate",\n                    "--input", str(input_path),\n                    "--output", str(output_dir),\n                    "--summary",\n                    "--output-json", str(result_path),\n                ],\n                cwd=REPO_ROOT,\n                check=False,\n                capture_output=True,\n                text=True,\n                timeout=180,\n            )\n            self.assertEqual(completed.returncode, 0, completed.stdout + completed.stderr)\n            result = json.loads(result_path.read_text(encoding="utf-8"))\n            self.assertEqual(result["result"], "PASS", result)\n            self.assertEqual(result.get("fail_codes"), [])\n            project_zip = Path(result["project_zip"])\n            companion = Path(result["companion"])\n            self.assertTrue(project_zip.is_file())\n            self.assertTrue(companion.is_file())\n            self.assertEqual(\n                companion.read_text(encoding="utf-8").split()[0],\n                hashlib.sha256(project_zip.read_bytes()).hexdigest(),\n            )\n            with zipfile.ZipFile(project_zip) as archive:\n                self.assertIsNone(archive.testzip())\n                cert_name = next(\n                    name for name in archive.namelist()\n                    if name.endswith("10_RELEASE/IDUNEX_PROJECT_CERTIFICATE.json")\n                )\n                certificate = json.loads(archive.read(cert_name))\n            self.assertEqual(certificate["engine_zip_sha"], baseline["tree_sha256"])\n            self.assertEqual(certificate["engine_zip_sha256"], baseline["tree_sha256"])\n            self.assertNotEqual(certificate["engine_zip_sha"], SENTINEL)\n            self.assertEqual(certificate["H113_POST_EXPORT_FINALIZER_SHA_PROOF_CERTIFICATE"], "PASS")\n            self.assertFalse(certificate["CREATIVE_OUTPUT_CERTIFIED"])\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8', newline='\n')

          audit_path.parent.mkdir(parents=True, exist_ok=True)
          audit_path.write_text('''# GOV-IDUNEX — Corrección de resolución de identidad H113\n\nFecha: 2026-07-22  \nVersión documental: v1  \nEstado: EN_REVISION  \nControl: AUD-033 / issue #64\n\n## Hallazgo validado\n\nEl run M02 `29936388876` ejecutó la matriz con la identidad post-AUD031 y obtuvo 0/30. Un workflow diagnóstico sintético aisló `FAIL_H113_DEFERRED_ENGINE_SHA_ACTIVE` con detalle `certificate engine sha invalid`.\n\nLa causa fue una dependencia circular en `resolve_engine_zip_sha256()`: la identidad AUD-003 del repositorio solo se aceptaba cuando `M02_RESULT=M02_PASS`, aunque M02 necesita generar la matriz antes de poder recomputar ese resultado.\n\n## Corrección\n\nLa identidad no-release se acepta únicamente cuando coinciden exactamente:\n\n- companion AUD-003;\n- manifiesto físico vigente;\n- `governance/CURRENT_STATE.json`;\n- `engine_change_control.current_engine_tree_sha256`;\n- conteo de archivos y bytes;\n- `MOTOR_STATUS=EN_REVISION`;\n- release y tag bloqueados.\n\nLa identidad criptográfica queda separada de la autorización operativa. Esta corrección no habilita Demo, generación general, agentes, release, tag, OFICIAL ni cierre productivo.\n\n## Evidencia requerida\n\n- prueba integral sintética N1;\n- certificado sin sentinel diferido;\n- ZIP y companion válidos;\n- baseline, governance, intake, security y runtime validator PASS;\n- M02 y M03 permanecen no recomputados hasta nuevas ejecuciones completas.\n\n## Reversión\n\nRevertir el commit correctivo completo restaura resolver, runner, manifiestos, estado y prueba. No se modifica el ZIP real del Proyecto 000 Demo.\n''', encoding='utf-8', newline='\n')
          PY

      - name: Regenerate engine manifests and synchronize authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import importlib.util
          import json
          import re
          import subprocess
          from pathlib import Path

          root = Path('.').resolve()
          scanner_path = root / 'tools/audit/baseline_scanner.py'
          spec = importlib.util.spec_from_file_location('aud033_baseline_scanner', scanner_path)
          scanner = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(scanner)
          payload = scanner.write_artifacts(root)

          state_path = root / 'governance/CURRENT_STATE.json'
          state = json.loads(state_path.read_text(encoding='utf-8'))
          engine_change = state.setdefault('engine_change_control', {})
          prior_tree = engine_change.get('current_engine_tree_sha256')
          engine_change.update({
              'previous_current_engine_tree_sha256': prior_tree,
              'current_engine_tree_sha256': payload['tree_sha256'],
              'current_engine_file_count': payload['file_count'],
              'current_engine_byte_count': payload['byte_count'],
              'manifests_recomputed_with_canonical_scanner': True,
              'subsequent_correction_issue': 'AUD-033',
              'subsequent_correction_base_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'subsequent_correction_reason': 'H113_CURRENT_TREE_IDENTITY_RESOLUTION',
              'm02_result': state.get('m02_result'),
              'm03_result': state.get('m03_result'),
          })
          state['last_correction_issue'] = 'AUD-033'
          state['last_failed_m02_run'] = 29936388876
          state['last_diagnostic_run'] = 29937730988
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')

          manifest_path = root / 'REPOSITORY_MANIFEST.yml'
          text = manifest_path.read_text(encoding='utf-8')
          if 'current_repository_commit_at_aud033_base:' not in text:
              text = text.replace(
                  '  current_repository_commit_at_aud031_base: 2790468f6b3bcc5286761def779276e8a77b6d20\n',
                  '  current_repository_commit_at_aud031_base: 2790468f6b3bcc5286761def779276e8a77b6d20\n'
                  '  current_repository_commit_at_aud033_base: 7852cea334d3e94d6c3821e2db516ae6bc8b8cd8\n',
              )
          text = re.sub(r'(?m)^  file_count: \d+$', f'  file_count: {payload["file_count"]}', text, count=1)
          text = re.sub(r'(?m)^  bytes: \d+$', f'  bytes: {payload["byte_count"]}', text, count=1)
          text = re.sub(r'(?m)^  tree_sha256: [0-9a-f]{64}$', f'  tree_sha256: {payload["tree_sha256"]}', text, count=1)
          aud033 = f'''\n\naud033_h113_current_tree_identity:\n  controlling_issue: 64\n  source_m02_run_id: 29936388876\n  diagnostic_run_id: 29937730988\n  base_commit: 7852cea334d3e94d6c3821e2db516ae6bc8b8cd8\n  previous_engine_tree_sha256: {prior_tree}\n  current_engine_tree_sha256: {payload["tree_sha256"]}\n  current_engine_file_count: {payload["file_count"]}\n  current_engine_bytes: {payload["byte_count"]}\n  status: IMPLEMENTED_PENDING_PR_REVIEW\n  root_failcode: FAIL_H113_DEFERRED_ENGINE_SHA_ACTIVE\n  m02_result: NOT_RECOMPUTED_POST_AUD030\n  m03_result: NOT_RECOMPUTED_POST_AUD030\n  demo_executed: false\n  refresh_external_artifacts_executed: false\n  release_authorized: false\n  tag_authorized: false\n  oficial_authorized: false\n  agent_load_authorized: false\n  creative_output_certified: false\n'''
          if 'aud033_h113_current_tree_identity:' not in text:
              text = text.rstrip() + aud033
          manifest_path.write_text(text.rstrip() + '\n', encoding='utf-8', newline='\n')

          evidence = root / '.aud033-evidence'
          evidence.mkdir(exist_ok=True)
          (evidence / 'new-engine-identity.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Validate correction before commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .aud033-evidence/checks

          run_check() {
            local name="$1"
            shift
            set +e
            "$@" >".aud033-evidence/checks/${name}.stdout.log" 2>".aud033-evidence/checks/${name}.stderr.log"
            local rc=$?
            set -e
            printf '%s\n' "$rc" >".aud033-evidence/checks/${name}.rc"
            if [[ "$rc" -ne 0 ]]; then
              echo "AUD033_CHECK_FAIL:${name}:rc=${rc}"
              tail -n 120 ".aud033-evidence/checks/${name}.stdout.log" || true
              tail -n 120 ".aud033-evidence/checks/${name}.stderr.log" || true
              return "$rc"
            fi
          }

          run_check h113_generate_test python -B -m unittest tests.intake.test_h113_current_tree_identity_generate -v
          run_check windows_watchdog_test python -B -m unittest tests.intake.test_generate_windows_watchdog -v
          run_check external_artifact_refresh_test python -B -m unittest tests.intake.test_external_artifact_refresh -v
          run_check post_audit_truthfulness_test python -B -m unittest tests.intake.test_post_audit_truthfulness -v
          run_check governance_state_test python -B -m unittest tests.intake.test_governance_state -v
          run_check baseline_scanner python -B tools/audit/baseline_scanner.py --repo-root .
          run_check governance_state_check python -B tools/audit/governance_state_check.py --repo-root .
          run_check intake_audit python -B tools/audit/intake_audit.py --repo-root .
          run_check security_lite_scan python -B tools/audit/security_lite_scan.py --repo-root .
          run_check runtime_validator python -B engine/IDUNEX/99_MANIFESTS_SHA_LINEAGE/VALIDATE_IDUNEX_RUNTIME.py engine/IDUNEX
          run_check diff_check git diff --check

          git status --porcelain > .aud033-evidence/git-status-before-commit.txt

      - name: Commit validated correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aleducase"
          git config user.email "232152987+aleducase@users.noreply.github.com"
          rm -rf .aud033-evidence
          git add engine/IDUNEX governance/CURRENT_STATE.json governance/baseline REPOSITORY_MANIFEST.yml tests/intake/test_h113_current_tree_identity_generate.py docs/audits/GOV-IDUNEX-CorreccionResolucionIdentidadH113-20260722-v1-EN_REVISION.md
          git diff --cached --check
          git commit -m "fix(aud-033): resolve current-tree identity without M02 circularity"
          git push origin HEAD:${{ github.head_ref }}
          git rev-parse HEAD
