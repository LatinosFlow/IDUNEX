name: IDUNEX Intake Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run intake audit
        run: python tools/audit/intake_audit.py --repo-root .
      - name: Check governance state consistency (AUD-006)
        run: python tools/audit/governance_state_check.py --repo-root .
      - name: Run governance state mutations (AUD-006)
        run: python -m unittest discover -s tests/intake -p 'test_governance_state.py'
      - name: Check Windows-safe remap integrity (AUD-005)
        run: python tools/audit/windows_path_remap_check.py --repo-root .
      - name: Run Windows-safe remap mutations (AUD-005)
        run: python -m unittest discover -s tests/intake -p 'test_windows_path_remap.py'
