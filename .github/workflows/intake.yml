name: IDUNEX Intake Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  intake:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install intake test dependencies
        run: python -m pip install python-docx==1.2.0
      - name: Run intake audit
        run: python tools/audit/intake_audit.py --repo-root .
      - name: Check governance state consistency (AUD-006)
        run: python tools/audit/governance_state_check.py --repo-root .
      - name: Run governance state mutations (AUD-006)
        run: python -m unittest discover -s tests/intake -p 'test_governance_state.py'
      - name: Check Windows-safe remap integrity (AUD-005)
        run: python tools/audit/windows_path_remap_check.py --repo-root .
      - name: Run Windows-safe remap mutations (AUD-005)
        run: python -m unittest discover -s tests/intake -p 'test_windows_path_remap.py'
      - name: Check reproducible physical baseline and manifests (AUD-003)
        run: python tools/audit/baseline_scanner.py --repo-root .
      - name: Run baseline hash mutation checks (AUD-003)
        run: python -m unittest discover -s tests/intake -p 'test_baseline_scanner.py'
      - name: Check named-project hardcoding and external Demo gates (AUD-007)
        run: python tools/audit/demo_hardcoding_check.py --repo-root .
      - name: Run Demo hardcoding mutations and non-Demo N1 smoke (AUD-007)
        run: python -m unittest discover -s tests/intake -p 'test_demo_hardcoding.py'
      - name: Check active bloat, milestone history, and reversible demotion (AUD-008)
        run: python tools/audit/no_bloat_no_history_check.py --repo-root .
      - name: Run AUD-008 duplicate, H-route, and authority mutations
        run: python -m unittest discover -s tests/intake -p 'test_no_bloat_no_history.py'
