name: AUD-031 PR Repair

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: aud-031-pr-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.head_ref == 'fix/aud-031-master-governance-contract-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@v4
        with:
          ref: fix/aud-031-master-governance-contract-sync
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned dependency
        run: python -m pip install --disable-pip-version-check python-docx==1.2.0

      - name: Apply canonical correction
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('tools/audit/aud031_contract_sync_repair.py')
          text=path.read_text(encoding='utf-8')
          old='''        cwd=ROOT,\n        check=True,\n    )'''
          new='''        cwd=ROOT,\n        check=False,\n    )'''
          if old not in text:
              raise SystemExit('AUD031_TRANSITIONAL_SCANNER_PATCH_NOT_FOUND')
          text=text.replace(old,new,1)
          start=text.index('    replacements = {\n')
          test_marker='        ROOT / "tests/m03/test_adversarial_harness.py": [\n'
          test_pos=text.index(test_marker,start)
          text=text[:start]+'    replacements = {\n'+text[test_pos:]
          path.write_text(text,encoding='utf-8',newline='\n')
          PY
          python tools/audit/aud031_contract_sync_repair.py 2>&1 | tee /tmp/aud031_apply.log

      - name: Upload repair diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aud031-repair-diagnostics-${{ github.run_id }}
          path: |
            /tmp/aud031_apply.log
            /tmp/aud031_identity.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce repair result
        if: steps.apply.outcome != 'success'
        run: exit 1

      - name: Validate corrected repository
        shell: bash
        run: |
          set -euo pipefail
          python tools/audit/baseline_scanner.py --repo-root .
          python tools/audit/governance_state_check.py --repo-root .
          python tools/audit/intake_audit.py --repo-root .
          python tools/audit/security_lite_scan.py --repo-root .
          python tools/audit/no_bloat_no_history_check.py --repo-root .
          python engine/IDUNEX/99_MANIFESTS_SHA_LINEAGE/VALIDATE_IDUNEX_RUNTIME.py engine/IDUNEX > /tmp/aud031_runtime.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('/tmp/aud031_runtime.json').read_text(encoding='utf-8'))
          assert payload.get('result')=='PASS', json.dumps(payload, indent=2)
          assert payload.get('validators_fail')==0, json.dumps(payload, indent=2)
          assert payload.get('fail_codes')==[], json.dumps(payload, indent=2)
          print(json.dumps({
              'result':payload.get('result'),
              'validators_fail':payload.get('validators_fail'),
              'blocking_warnings':payload.get('blocking_warnings'),
              'fail_codes':payload.get('fail_codes'),
          }, indent=2))
          PY
          python -m unittest \
            tests.intake.test_baseline_scanner \
            tests.intake.test_governance_state \
            tests.intake.test_no_bloat_no_history \
            tests.intake.test_external_artifact_refresh \
            tests.intake.test_post_audit_truthfulness -v
          git diff --check

      - name: Commit non-workflow correction
        id: commit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            rm -f tools/audit/aud031_contract_sync_repair.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git diff --cached --check
            git commit -m "fix(aud-031): sincronizar contrato maestro post-AUD030"
            git push origin HEAD:fix/aud-031-master-governance-contract-sync
          } 2>&1 | tee /tmp/aud031_commit.log

      - name: Upload commit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aud031-commit-diagnostics-${{ github.run_id }}
          path: /tmp/aud031_commit.log
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce commit result
        if: steps.commit.outcome != 'success'
        run: exit 1

      - name: Publish result summary
        run: cat /tmp/aud031_identity.json >> "$GITHUB_STEP_SUMMARY"
