name: AUD-033 Repository Manifest Parity Repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/aud-033-manifest-parity-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Repair exact repository manifest blocks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('REPOSITORY_MANIFEST.yml')
          text=path.read_text(encoding='utf-8')
          old_historical='''historical_received_baseline:\n  filename: IDUNEX_MOTOR_v1.0.0.zip\n  sha256: bbef200d6f0d7bf116853e0d763b90dc0b6454efee831e6dee1b040c78fce0d6\n  bytes: 47323574\n'''
          new_historical='''historical_received_baseline:\n  filename: IDUNEX_MOTOR_v1.0.0.zip\n  sha256: bbef200d6f0d7bf116853e0d763b90dc0b6454efee831e6dee1b040c78fce0d6\n  bytes: 4277381\n'''
          old_current='''  file_count: 981\n  bytes: 47322002\n  tree_sha256: 58454565d354e0f641c1fc4954e867822fd90d4b316c803922a087cd4e7601c7\n'''
          new_current='''  file_count: 981\n  bytes: 47323574\n  tree_sha256: 58454565d354e0f641c1fc4954e867822fd90d4b316c803922a087cd4e7601c7\n'''
          if text.count(old_historical)!=1:
              raise SystemExit('AUD033_HISTORICAL_BLOCK_MISMATCH')
          if text.count(old_current)!=1:
              raise SystemExit('AUD033_CURRENT_BLOCK_MISMATCH')
          path.write_text(text.replace(old_historical,new_historical).replace(old_current,new_current), encoding='utf-8', newline='\n')
          PY

      - name: Validate repaired authority
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/audit/baseline_scanner.py --repo-root .
          python -B tools/audit/governance_state_check.py --repo-root .
          python -B tools/audit/intake_audit.py --repo-root .
          python -B tools/audit/security_lite_scan.py --repo-root .
          git diff --check
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          manifest=Path('REPOSITORY_MANIFEST.yml').read_text(encoding='utf-8')
          baseline=json.loads(Path('governance/baseline/IDUNEX_CURRENT_TREE_MANIFEST.json').read_text(encoding='utf-8'))
          historical=re.search(r'historical_received_baseline:\n(?:.*\n)*?  bytes: (\d+)\n', manifest)
          current=re.search(r'current_corrected_tree:\n(?:.*\n)*?  file_count: (\d+)\n  bytes: (\d+)\n  tree_sha256: ([0-9a-f]{64})\n', manifest)
          assert historical and int(historical.group(1))==4277381
          assert current
          assert int(current.group(1))==baseline['file_count']
          assert int(current.group(2))==baseline['byte_count']
          assert current.group(3)==baseline['tree_sha256']
          PY

      - name: Commit repaired manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aleducase"
          git config user.email "232152987+aleducase@users.noreply.github.com"
          git add REPOSITORY_MANIFEST.yml
          git diff --cached --check
          git commit -m "fix(aud-033): restore historical and current manifest byte scopes"
          git push origin HEAD:${{ github.head_ref }}
